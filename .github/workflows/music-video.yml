name: Thai singer test
on:
  workflow_dispatch:
    inputs:
      lip_task_id:
        description: Existing lip-sync task ID (resume status check without any new paid API call)
        required: false
        type: string
      origin_task_id:
        description: Existing completed Kling video task ID (skip paid video generation)
        required: false
        type: string
      image_url:
        description: Direct HTTPS URL of singer image (only if generating a new video)
        required: false
        type: string
      audio_url:
        description: Direct HTTPS URL of 8-second Thai audio excerpt
        required: true
        type: string
jobs:
  generate:
    environment: Musicvid
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate singing video (paid API calls)
        env:
          PIAPI_KEY: ${{ secrets.PIAPI_KEY }}
          IMAGE_URL: ${{ inputs.image_url }}
          ORIGIN_TASK_ID: ${{ inputs.origin_task_id }}
          LIP_TASK_ID: ${{ inputs.lip_task_id }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          if [ -n "$LIP_TASK_ID" ]; then
            python generate.py --lip-task-id "$LIP_TASK_ID" --audio-url "$AUDIO_URL"
          elif [ -n "$ORIGIN_TASK_ID" ]; then
            python generate.py --origin-task-id "$ORIGIN_TASK_ID" --audio-url "$AUDIO_URL"
          else
            python generate.py --image-url "$IMAGE_URL" --audio-url "$AUDIO_URL"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thai-singer-test
          path: |
            thai_singer_test.mp4
            result.json
          if-no-files-found: warn
